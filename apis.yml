name: Helika
description: >-
  Helika is a game and brand analytics platform, originally built for web3 and
  blockchain games, that helps studios, sports teams, and entertainment brands
  collect, unify, and act on player and community engagement data. Its Analytics
  Service API ingests gameplay and engagement events through a single events
  endpoint authenticated with an x-api-key header, and is instrumented by
  first-party Unity, Unreal Engine, and Web SDKs. Helika has since expanded into
  Helika Evolve, an AI-character platform that lets IP owners deploy brand-safe
  interactive characters across Discord, web, and social channels. Helika is a
  Pantera Capital portfolio company operating in the crypto and gaming sector.
